name: CI/CT

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    name: Build, Test and Coverage
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      issues: write
      pull-requests: write
      checks: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      
      - name: Build with Maven
        run: mvn clean install -DskipTests
      
      - name: Run tests
        run: mvn test
        continue-on-error: false
      
      - name: Generate JaCoCo coverage report
        run: mvn jacoco:report
        if: always()
      
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage-report
          path: |
            target/site/jacoco/
            target/jacoco.exec
          retention-days: 30
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: target/surefire-reports/
          retention-days: 30
      
      - name: Cleanup temporary files
        if: always()
        run: |
          echo "Cleaning up temporary files..."
          # Remove Maven's target directory except for artifacts we're uploading
          # Keep surefire-reports and site/jacoco for artifact upload
          if [ -d "target" ]; then
            find target -type f \( -name "*.tmp" -o -name "*.log" \) -delete 2>/dev/null || true
            # Clean up Maven's work directories
            rm -rf target/maven-status target/maven-archiver 2>/dev/null || true
          fi
          echo "Cleanup completed"
      
      - name: Report test results
        if: always()
        run: |
          if [ -d "target/surefire-reports" ]; then
            echo "### Test Results Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            # Count test results more efficiently with a single pass
            RESULTS=$(find target/surefire-reports -name "TEST-*.xml" -exec grep -h '<testsuite' {} \; | \
              awk -F'"' '
                BEGIN { tests=0; failures=0; errors=0; skipped=0; }
                {
                  for(i=1;i<=NF;i++) {
                    if($i=="tests") tests+=$(i+1);
                    if($i=="failures") failures+=$(i+1);
                    if($i=="errors") errors+=$(i+1);
                    if($i=="skipped") skipped+=$(i+1);
                  }
                }
                END { print tests" "failures" "errors" "skipped; }
              ')
            
            read TESTS FAILURES ERRORS SKIPPED <<< "$RESULTS"
            
            echo "- **Total Tests**: ${TESTS:-0}" >> $GITHUB_STEP_SUMMARY
            echo "- **Failures**: ${FAILURES:-0}" >> $GITHUB_STEP_SUMMARY
            echo "- **Errors**: ${ERRORS:-0}" >> $GITHUB_STEP_SUMMARY
            echo "- **Skipped**: ${SKIPPED:-0}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            if [ "${FAILURES:-0}" -gt 0 ] || [ "${ERRORS:-0}" -gt 0 ]; then
              echo "❌ **Tests failed!**" >> $GITHUB_STEP_SUMMARY
              exit 1
            else
              echo "✅ **All tests passed!**" >> $GITHUB_STEP_SUMMARY
            fi
          fi
      
      - name: Comment PR with results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            let comment = '### CI/CT Results\n\n';
            
            // Read test results
            const surefireDir = 'target/surefire-reports';
            if (fs.existsSync(surefireDir)) {
              const files = fs.readdirSync(surefireDir).filter(f => f.startsWith('TEST-') && f.endsWith('.xml'));
              
              if (files.length > 0) {
                let totalTests = 0, failures = 0, errors = 0, skipped = 0;
                
                files.forEach(file => {
                  const content = fs.readFileSync(path.join(surefireDir, file), 'utf8');
                  const testsMatch = content.match(/tests="(\d+)"/);
                  const failuresMatch = content.match(/failures="(\d+)"/);
                  const errorsMatch = content.match(/errors="(\d+)"/);
                  const skippedMatch = content.match(/skipped="(\d+)"/);
                  
                  if (testsMatch) totalTests += parseInt(testsMatch[1]);
                  if (failuresMatch) failures += parseInt(failuresMatch[1]);
                  if (errorsMatch) errors += parseInt(errorsMatch[1]);
                  if (skippedMatch) skipped += parseInt(skippedMatch[1]);
                });
                
                comment += `#### Test Results\n`;
                comment += `- Total Tests: **${totalTests}**\n`;
                comment += `- Failures: **${failures}**\n`;
                comment += `- Errors: **${errors}**\n`;
                comment += `- Skipped: **${skipped}**\n\n`;
                
                if (failures > 0 || errors > 0) {
                  comment += '❌ **Some tests failed!**\n\n';
                } else {
                  comment += '✅ **All tests passed!**\n\n';
                }
              }
            }
            
            comment += `#### Artifacts\n`;
            comment += `- JaCoCo coverage report is available in workflow artifacts\n`;
            comment += `- Test results are available in workflow artifacts\n\n`;
            comment += `**Workflow Run**: [View Details](${context.payload.repository.html_url}/actions/runs/${context.runId})\n`;
            
            // Post comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });
