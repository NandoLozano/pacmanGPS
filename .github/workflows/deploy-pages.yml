name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: ["CI/CT"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build JAR and Landing Page
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      
      - name: Build with Maven
        run: mvn clean package -DskipTests
      
      - name: Create deployment directory
        run: |
          mkdir -p _site
          
          # Copy JAR file - fail if not found
          if ls target/*.jar 1> /dev/null 2>&1; then
            cp target/*.jar _site/
            echo "✅ JAR file copied successfully"
          else
            echo "❌ Error: JAR file not found in target directory"
            exit 1
          fi
          
          # Copy index.html - fail if not found
          if [ -f "index.html" ]; then
            cp index.html _site/
            echo "✅ index.html copied successfully"
          else
            echo "❌ Error: index.html not found"
            exit 1
          fi
          
          # Copy assets if they exist (optional)
          if [ -d "assets" ]; then
            cp -r assets _site/
            echo "✅ Assets directory copied"
          else
            echo "ℹ️ No assets directory found (optional)"
          fi
          
          echo "📦 Deployment directory contents:"
          ls -la _site/
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
  
  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      
      - name: Notify deployment
        run: |
          echo "### 🚀 Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 **Landing page deployed to**: ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "You can download the PacMan GPS JAR file from the landing page!" >> $GITHUB_STEP_SUMMARY
